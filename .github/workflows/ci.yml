name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build -o go-health .

      - name: Build Docker image
        run: docker build -t go-health .